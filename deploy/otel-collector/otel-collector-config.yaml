# Minimal collector config. No real traces/metrics/logs are being sent
# yet — nothing in the stack is instrumented. The "debug" exporter just
# prints anything it receives to its own container logs, which is enough
# to prove the collector starts cleanly and its pipeline is wired
# correctly. Swap in real exporters (Prometheus remote-write, Tempo,
# Loki, etc.) once there's actual telemetry to send — likely Phase 2+
# when the gateway/router services exist and get instrumented.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    # This gives us a real HTTP /health endpoint (200 OK when the
    # collector is up and its pipelines are wired correctly). It's
    # NOT wired into a Docker Compose `healthcheck:` block below, because
    # this image has no shell/curl/wget to run a check FROM — verify it
    # manually (curl from your host, since the port is published) or
    # from another container until that's worth automating.

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug]