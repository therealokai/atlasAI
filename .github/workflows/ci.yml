name: CI

# Runs on every push and every PR — you want to know about a broken build
# before it merges, not after.
on:
  workflow_dispatch: # on manual workflow run
  push:
    branches: ["**"] # on push over all branches
  pull_request:
    branches: ["**"] # on pR over all branches

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo to Github VM
        uses: actions/checkout@v4
      
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install lint deps
        run: |
          pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo to Github VM
        uses: actions/checkout@v4
      
      - name: Instal python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-day2.txt
            requirements-dev.txt

      - name: Install deps
        run: |
          pip install -r requirements-day2.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo to Github VM
        uses: actions/checkout@v4
      
      - name: Build gateway image
        run: docker build -t atlasai-gateway:ci -f services/gateway/Dockerfile .
      # Deliberately just `docker build`, never `docker compose up`, and
      # vLLM is never involved here. GitHub-hosted runners have no GPU,
      # so vLLM would crash on startup if we tried to run it in CI — this
      # job's only job is proving the Dockerfile builds cleanly. Full
      # gateway+vLLM integration testing has to happen locally (or on a
      # self-hosted GPU runner later), not here. - totally agree